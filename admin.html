/* ==========================================================
   COFFEE IMPERO  |  black, champagne gold, ivory
   Mobile first. One stylesheet for the shop and the admin.
   ========================================================== */

:root{
  --ink:#080807;
  --ink-2:#0E0E0D;
  --ink-3:#151513;
  --ivory:#F4F1EA;
  --muted:rgba(244,241,234,.52);
  --muted-2:rgba(244,241,234,.34);
  --gold:#C2A26A;
  --gold-soft:#D8BE8D;
  --line:rgba(244,241,234,.11);
  --line-gold:rgba(194,162,106,.38);
  --red:#C8553D;
  --green:#6E8F63;
  --display:'Italiana',Georgia,serif;
  --ui:'Jost','Helvetica Neue',Arial,sans-serif;
  --pad:22px;
  --head:64px;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media(min-width:900px){:root{--pad:56px;--head:80px}}

/* fixed dark identity; hooks kept so a forced scheme cannot break it */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#080807;--ivory:#F4F1EA}}
:root[data-theme="dark"]{--ink:#080807;--ivory:#F4F1EA}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--ink);color:var(--ivory);
  font-family:var(--ui);font-weight:300;font-size:16px;line-height:1.6;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0}
::selection{background:var(--gold);color:var(--ink)}
:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}

.shell{width:min(1280px,100%);margin-inline:auto;padding-inline:var(--pad)}
.skip{position:absolute;left:-9999px}
.skip:focus{left:8px;top:8px;z-index:200;background:var(--gold);color:var(--ink);padding:10px 16px}

/* ---------- type ---------- */
h1,h2,h3{margin:0;font-weight:400;line-height:1.05}
.display{font-family:var(--display);font-size:clamp(2.9rem,13vw,7.5rem);letter-spacing:.01em;line-height:.98}
.h2{font-family:var(--display);font-size:clamp(2rem,7.5vw,4rem);letter-spacing:.015em}
.h3{font-family:var(--display);font-size:clamp(1.5rem,5vw,2.2rem)}
p{margin:0}
.lede{color:var(--muted);font-size:clamp(.95rem,3.6vw,1.06rem);max-width:34ch}
.eyebrow{
  font-size:.62rem;letter-spacing:.42em;text-transform:uppercase;
  color:var(--gold);font-weight:400;
}
.rule-gold{height:1px;background:linear-gradient(90deg,var(--line-gold),transparent);border:0;margin:0}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:54px;padding:0 32px;cursor:pointer;
  font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;font-weight:400;
  border:1px solid var(--gold);color:var(--gold);
  background:transparent;
  transition:background .45s var(--ease),color .45s var(--ease),border-color .45s var(--ease);
}
.btn:hover{background:var(--gold);color:var(--ink)}
.btn-solid{background:var(--gold);color:var(--ink)}
.btn-solid:hover{background:var(--gold-soft);border-color:var(--gold-soft)}
.btn-ghost{border-color:var(--line);color:var(--ivory)}
.btn-ghost:hover{background:transparent;border-color:var(--ivory);color:var(--ivory)}
.btn-block{width:100%}
.btn[disabled]{opacity:.32;pointer-events:none}
.btn-sm{min-height:42px;padding:0 18px;font-size:.62rem;letter-spacing:.2em}

/* ---------- header ---------- */
.header{
  position:fixed;top:0;left:0;right:0;z-index:70;
  transition:background .5s var(--ease),border-color .5s var(--ease);
  border-bottom:1px solid transparent;
}
.header.solid{background:rgba(8,8,7,.86);backdrop-filter:blur(14px);border-bottom-color:var(--line)}
.header-in{height:var(--head);display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:11px}
.brand img{height:26px;width:auto}
.brand span{font-family:var(--display);font-size:1rem;letter-spacing:.34em;text-transform:uppercase;white-space:nowrap}
@media(min-width:900px){.brand img{height:32px}.brand span{font-size:1.12rem}}

.nav{display:none;gap:44px}
.nav a{font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);transition:color .3s}
.nav a:hover{color:var(--gold)}
@media(min-width:900px){.nav{display:flex}}

.h-actions{display:flex;align-items:center;gap:2px}
.icon-btn{width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.icon-btn svg{width:20px;height:20px;stroke:var(--ivory);fill:none;stroke-width:1.2}
.count{
  position:absolute;top:7px;right:5px;min-width:16px;height:16px;border-radius:8px;
  background:var(--gold);color:var(--ink);font-size:.58rem;line-height:16px;text-align:center;
  padding:0 4px;display:none;font-weight:500;
}
.count.on{display:block}
.menu-btn{display:inline-flex}
@media(min-width:900px){.menu-btn{display:none}}

.mnav{display:none;background:var(--ink-2);border-bottom:1px solid var(--line)}
.mnav.open{display:block}
.mnav a{display:block;padding:18px var(--pad);border-bottom:1px solid var(--line);font-size:.75rem;letter-spacing:.24em;text-transform:uppercase}
.mnav a:last-child{border-bottom:0}

/* ---------- hero ---------- */
.hero{position:relative;padding-top:var(--head);min-height:100svh;display:flex;align-items:center;overflow:hidden}
.hero-in{display:grid;gap:8px;padding-block:40px 56px;width:100%}
.hero-copy{text-align:center}
.hero .eyebrow{display:block;margin-bottom:22px}
.hero .display{margin-bottom:20px}
.hero .lede{margin:0 auto 34px}
.hero-fig{position:relative;display:flex;justify-content:center;margin-top:-8px}
.hero-fig img{
  width:min(74vw,330px);filter:drop-shadow(0 40px 60px rgba(0,0,0,.75));
  animation:float 9s ease-in-out infinite;
}
.hero-glow{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:min(88vw,420px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(194,162,106,.16),transparent 62%);
  z-index:-1;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

@media(min-width:900px){
  .hero-in{grid-template-columns:1fr 1fr;align-items:center;gap:40px;padding-block:0}
  .hero-copy{text-align:left}
  .hero .lede{margin:0 0 38px}
  .hero-fig img{width:min(34vw,440px)}
  .hero-actions{justify-content:flex-start}
}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

.scroll-hint{
  position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
  font-size:.58rem;letter-spacing:.34em;text-transform:uppercase;color:var(--muted-2);
  display:none;
}
@media(min-width:900px) and (min-height:720px){.scroll-hint{display:block}}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(22px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv-2{transition-delay:.12s}
.rv-3{transition-delay:.24s}

/* ---------- sections ---------- */
.section{padding:clamp(72px,14vw,150px) 0}
.section-head{margin-bottom:clamp(34px,7vw,64px)}
.section-head .eyebrow{display:block;margin-bottom:16px}

/* ---------- collection ---------- */
.grid{display:grid;gap:clamp(34px,7vw,28px)}
@media(min-width:860px){.grid{grid-template-columns:repeat(3,1fr);gap:24px}}

.card{
  position:relative;border:1px solid var(--line);background:linear-gradient(180deg,var(--ink-2),var(--ink));
  padding:30px 24px 26px;display:flex;flex-direction:column;text-align:center;
  transition:border-color .55s var(--ease),transform .55s var(--ease);
}
.card:hover{border-color:var(--line-gold);transform:translateY(-4px)}
.card-img{position:relative;display:flex;justify-content:center;align-items:flex-end;height:270px;margin-bottom:26px}
.card-img img{max-height:100%;width:auto;transition:transform .8s var(--ease);filter:drop-shadow(0 26px 34px rgba(0,0,0,.6))}
.card:hover .card-img img{transform:scale(1.05)}
.card h3{font-family:var(--display);font-size:1.6rem;letter-spacing:.06em;margin-bottom:10px}
.card-spec{font-size:.64rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:20px}
.card-price{font-family:var(--display);font-size:1.4rem;margin-bottom:20px}
.card .btn{margin-top:auto}

.stock-tag{
  font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px;min-height:1em;
}
.stock-tag.low{color:var(--gold-soft)}
.stock-tag.out{color:var(--red)}

.swatch-row{display:flex;gap:7px;justify-content:center;margin-bottom:18px}
.sw{width:13px;height:13px;border-radius:50%;border:1px solid rgba(255,255,255,.22);display:inline-block}

/* ---------- statement band ---------- */
.band{position:relative;min-height:74svh;display:flex;align-items:flex-end;overflow:hidden}
.band-img{position:absolute;inset:0}
.band-img img{width:100%;height:100%;object-fit:cover;opacity:.55}
.band::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top,var(--ink) 4%,rgba(8,8,7,.55) 45%,rgba(8,8,7,.25) 100%);
}
.band-copy{position:relative;z-index:2;padding:0 0 clamp(44px,9vw,90px);width:100%}

/* ---------- spec strip ---------- */
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-block:1px solid var(--line)}
@media(min-width:760px){.specs{grid-template-columns:repeat(5,1fr)}}
.spec{background:var(--ink);padding:30px 18px;text-align:center}
.spec b{display:block;font-family:var(--display);font-size:clamp(1.35rem,5.2vw,1.9rem);font-weight:400;color:var(--ivory);margin-bottom:6px;line-height:1.1}
.spec span{font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.specs .spec:last-child:nth-child(odd){grid-column:1/-1}
@media(min-width:760px){.specs .spec:last-child:nth-child(odd){grid-column:auto}}

/* ---------- compare ---------- */
.compare{border:1px solid var(--line)}
.crow{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;padding:18px 16px;border-bottom:1px solid var(--line);align-items:center}
.crow:last-child{border-bottom:0}
.crow b{font-family:var(--display);font-size:1.02rem;font-weight:400;letter-spacing:.05em}
.crow span{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:center}
.crow.head span,.crow.head b{color:var(--gold);font-size:.58rem;letter-spacing:.26em}

/* ---------- lifestyle pair ---------- */
.pair{display:grid;gap:14px}
@media(min-width:800px){.pair{grid-template-columns:1fr 1fr}}
.pair figure{margin:0;position:relative;overflow:hidden}
.pair img{width:100%;aspect-ratio:4/5;object-fit:cover;opacity:.78;transition:transform 1.4s var(--ease),opacity .6s}
.pair figure:hover img{transform:scale(1.04);opacity:.92}
.pair figcaption{
  position:absolute;left:20px;bottom:18px;
  font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ivory);
  text-shadow:0 2px 14px rgba(0,0,0,.8);
}

/* ---------- contact ---------- */
.contact-line{font-family:var(--display);font-size:clamp(1.6rem,7vw,2.6rem);letter-spacing:.04em}

/* ---------- footer ---------- */
.footer{border-top:1px solid var(--line);padding:56px 0 34px;background:var(--ink-2)}
.footer-grid{display:grid;gap:30px}
@media(min-width:760px){.footer-grid{grid-template-columns:1.6fr 1fr 1fr}}
.footer h4{font-family:var(--ui);font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin:0 0 16px;font-weight:400}
.footer ul{list-style:none;margin:0;padding:0;display:grid;gap:11px;font-size:.85rem;color:var(--muted)}
.footer ul a:hover{color:var(--ivory)}
.footer-tag{font-family:var(--display);font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.footer-bottom{margin-top:44px;padding-top:22px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;font-size:.68rem;color:var(--muted-2)}

/* ---------- floating whatsapp ---------- */
.wa{
  position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:55;
  width:50px;height:50px;border-radius:50%;border:1px solid var(--line-gold);
  background:rgba(8,8,7,.9);display:inline-flex;align-items:center;justify-content:center;
}
.wa svg{width:22px;height:22px;fill:var(--gold)}

/* ---------- overlay panels ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);opacity:0;pointer-events:none;transition:opacity .4s var(--ease);z-index:90;backdrop-filter:blur(2px)}
.scrim.open{opacity:1;pointer-events:auto}
.panel{
  position:fixed;z-index:100;background:var(--ink-2);border-left:1px solid var(--line);
  top:0;right:0;bottom:0;width:min(440px,100%);
  transform:translateX(101%);transition:transform .5s var(--ease);
  display:flex;flex-direction:column;
}
.panel.open{transform:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:20px var(--pad);border-bottom:1px solid var(--line)}
.panel-head h2{font-family:var(--ui);font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.panel-body{flex:1;overflow-y:auto;padding:var(--pad);-webkit-overflow-scrolling:touch}
.panel-foot{padding:var(--pad);padding-bottom:calc(var(--pad) + env(safe-area-inset-bottom));border-top:1px solid var(--line)}

/* product detail inside the panel */
.pd-img{display:flex;justify-content:center;margin-bottom:24px}
.pd-img img{max-height:300px;width:auto;filter:drop-shadow(0 26px 40px rgba(0,0,0,.7))}
.pd-name{font-family:var(--display);font-size:2rem;letter-spacing:.05em;margin-bottom:8px}
.pd-spec{font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
.pd-price{font-family:var(--display);font-size:1.5rem;margin-bottom:24px}
.field-label{display:block;font-size:.58rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.opt-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}
.opt{
  display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:0 16px 0 12px;
  border:1px solid var(--line);font-size:.72rem;letter-spacing:.1em;cursor:pointer;
  transition:border-color .3s,color .3s;
}
.opt i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.opt[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

.qty{display:inline-flex;align-items:center;border:1px solid var(--line)}
.qty button{width:46px;height:46px;cursor:pointer;font-size:1.1rem;color:var(--ivory)}
.qty input{width:50px;height:46px;text-align:center;background:none;border:0;color:var(--ivory);font-size:.95rem;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.spec-list{border-top:1px solid var(--line);margin-top:26px}
.spec-list div{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:.78rem}
.spec-list dt{color:var(--muted);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase}
.spec-list dd{margin:0}

/* cart lines */
.line{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.line img{width:100%}
.line h3{font-family:var(--display);font-size:1.05rem;letter-spacing:.04em}
.line p{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:4px 0 10px}
.line-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.line .qty button{width:34px;height:34px;font-size:.95rem}
.line .qty input{width:32px;height:34px;font-size:.8rem}
.link-x{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);cursor:pointer}
.link-x:hover{color:var(--ivory)}
.empty{padding:60px 0;text-align:center;color:var(--muted)}

.totals{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.totals b{font-family:var(--display);font-size:1.45rem;font-weight:400}

/* forms */
.field{margin-bottom:16px}
.field input,.field textarea,.field select{
  width:100%;min-height:52px;padding:14px 15px;background:var(--ink);
  border:1px solid var(--line);color:var(--ivory);font-family:var(--ui);font-size:1rem;border-radius:0;
}
.field textarea{min-height:88px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--gold);outline:none}
.field.bad input,.field.bad textarea{border-color:var(--red)}
.err{display:none;color:var(--red);font-size:.72rem;margin-top:6px}
.field.bad .err{display:block}
.note{font-size:.74rem;color:var(--muted);line-height:1.6}
.alert{border:1px solid var(--red);color:#E39685;padding:14px;font-size:.8rem;margin-bottom:16px;display:none}
.alert.on{display:block}

.ok-wrap{text-align:center;padding:30px 0}
.ok-no{font-family:var(--display);font-size:2.6rem;color:var(--gold);margin:10px 0 6px}

.no-scroll{overflow:hidden}

/* ==========================================================
   ADMIN
   ========================================================== */
.admin-shell{max-width:1100px;margin-inline:auto;padding:0 var(--pad) 80px}
.admin-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:26px;padding-bottom:4px}
.tab{
  flex:0 0 auto;padding:11px 18px;border:1px solid var(--line);cursor:pointer;
  font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);white-space:nowrap;
}
.tab[aria-selected="true"]{border-color:var(--gold);color:var(--gold)}
.pane{display:none}
.pane.on{display:block}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:28px}
@media(min-width:760px){.stats{grid-template-columns:repeat(5,1fr)}}
.stat{background:var(--ink);padding:22px 16px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:2rem;font-weight:400;margin-bottom:4px}
.stat span{font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.stat.warn b{color:var(--gold-soft)}
.stat.bad b{color:var(--red)}

.inv{border:1px solid var(--line);padding:20px;margin-bottom:14px}
.inv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px}
.inv-head h3{font-family:var(--display);font-size:1.3rem;letter-spacing:.05em}
.inv-head small{display:block;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-top:5px}
.pill{font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.in{border-color:var(--green);color:var(--green)}
.pill.low{border-color:var(--gold);color:var(--gold)}
.pill.out{border-color:var(--red);color:var(--red)}
.inv-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.inv-row .field{margin:0}
.inv-row input{min-height:46px;width:90px;padding:8px 10px;text-align:center;background:var(--ink);border:1px solid var(--line);color:var(--ivory)}
.inv-label{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);width:100%}

.tablewrap{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:.82rem;white-space:nowrap}
th{font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:400}
tr:last-child td{border-bottom:0}

.order{border:1px solid var(--line);padding:18px;margin-bottom:12px}
.order-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.order-no{font-family:var(--display);font-size:1.2rem;color:var(--gold)}
.order dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 14px;font-size:.82rem}
.order dt{color:var(--muted);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;padding-top:3px}
.order dd{margin:0}
.status-row{display:flex;gap:6px;flex-wrap:wrap}
.status-row button{padding:8px 12px;border:1px solid var(--line);font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.status-row button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

.login-wrap{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:var(--pad)}
.login{width:min(400px,100%);border:1px solid var(--line);padding:36px 28px;background:var(--ink-2)}
.login .brand{justify-content:center;margin-bottom:28px}

.loading{padding:50px 0;text-align:center;color:var(--muted);font-size:.72rem;letter-spacing:.24em;text-transform:uppercase}

</style>
</head>

    <section class="pane" id="pane-data">
      <div class="tablewrap"><table id="dataTable"></table></div>
    </section>

    <section class="pane" id="pane-history">
      <div class="tablewrap"><table id="historyTable"></table></div>
    </section>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ==========================================================
   COFFEE IMPERO  |  admin
   Sign in with Supabase Auth, then manage stock and orders.
   Nothing here works without a valid session.
   ========================================================== */

(function () {
  "use strict";

  var CFG = window.CI_CONFIG || {};
  var CUR = CFG.CURRENCY || "QAR";
  var STATUSES = ["NEW","CONFIRMED","OUT FOR DELIVERY","COMPLETED","CANCELLED"];
  var db = null, products = [], orders = [], logs = [];

  function money(n){ return CUR + " " + Number(n).toFixed(0); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function when(ts){
    var d=new Date(ts);
    return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) +
           " " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  }
  function state(p){
    if(!p.active) return {cls:"out", label:"Disabled"};
    if(p.stock<=0) return {cls:"out", label:"Out of stock"};
    if(p.stock<=p.low_stock_at) return {cls:"low", label:"Low stock"};
    return {cls:"in", label:"In stock"};
  }
  function el(id){ return document.getElementById(id); }

  /* ---------------- auth ---------------- */

  // If no key was pasted here, borrow the one already saved in index.html.
  function findKey(){
    if(CFG.SUPABASE_KEY) return Promise.resolve(CFG.SUPABASE_KEY);
    return fetch("index.html", {cache:"no-store"})
      .then(function(r){ return r.text(); })
      .then(function(t){
        var m = t.match(/SUPABASE_KEY\s*:\s*"([^"]+)"/);
        return m ? m[1] : "";
      })
      .catch(function(){ return ""; });
  }

  function init(){
    if(!window.supabase){
      el("loginAlert").textContent="Could not load the database library. Check your connection and reload.";
      el("loginAlert").classList.add("on");
      el("loginBtn").disabled=true;
      return;
    }
    el("loginBtn").disabled=true;
    findKey().then(function(key){
      if(!key){
        el("loginAlert").textContent="Not connected yet. Paste your Supabase key into the settings block at the top of index.html.";
        el("loginAlert").classList.add("on");
        return;
      }
      el("loginBtn").disabled=false;
      start(key);
    });
  }

  function start(key){
    db = window.supabase.createClient(CFG.SUPABASE_URL, key);
    db.auth.getSession().then(function(res){
      if(res.data && res.data.session) show();
    });

    el("loginForm").addEventListener("submit", signIn);
    el("logoutBtn").addEventListener("click", function(){
      db.auth.signOut().then(function(){ location.reload(); });
    });
    el("refreshBtn").addEventListener("click", loadAll);

    document.querySelectorAll(".tab").forEach(function(t){
      t.addEventListener("click", function(){
        document.querySelectorAll(".tab").forEach(function(x){ x.setAttribute("aria-selected", x===t?"true":"false"); });
        document.querySelectorAll(".pane").forEach(function(p){ p.classList.remove("on"); });
        el("pane-"+t.dataset.pane).classList.add("on");
      });
    });
  }

  function signIn(e){
    e.preventDefault();
    var a=el("loginAlert"); a.classList.remove("on");
    var btn=el("loginBtn"); btn.disabled=true; btn.textContent="Signing in";
    db.auth.signInWithPassword({ email: el("email").value.trim(), password: el("password").value })
      .then(function(res){
        if(res.error) throw res.error;
        show();
      })
      .catch(function(err){
        a.textContent = err.message || "Could not sign in.";
        a.classList.add("on");
      })
      .then(function(){ btn.disabled=false; btn.textContent="Sign in"; });
  }

  function show(){
    el("loginView").hidden=true;
    el("loginView").style.display="none";
    el("appView").hidden=false;
    loadAll();
  }

  /* ---------------- load ---------------- */

  function loadAll(){
    el("stats").innerHTML='<div class="loading" style="grid-column:1/-1">Loading</div>';
    Promise.all([
      db.from("products").select("*").order("sort_order"),
      db.from("orders").select("*, order_items(*)").order("created_at",{ascending:false}).limit(100),
      db.from("stock_log").select("*").order("created_at",{ascending:false}).limit(60)
    ]).then(function(r){
      products = r[0].data || [];
      orders   = r[1].data || [];
      logs     = r[2].data || [];
      renderStats(); renderInventory(); renderOrders(); renderData(); renderHistory();
    });
  }

  /* ---------------- overview ---------------- */

  function renderStats(){
    var totalStock = products.reduce(function(n,p){ return n+p.stock; },0);
    var low  = products.filter(function(p){ return p.active && p.stock>0 && p.stock<=p.low_stock_at; }).length;
    var out  = products.filter(function(p){ return p.stock<=0; }).length;
    var open = orders.filter(function(o){ return o.status!=="COMPLETED" && o.status!=="CANCELLED"; }).length;
    el("stats").innerHTML =
      '<div class="stat"><b>'+products.length+'</b><span>Products</span></div>'+
      '<div class="stat"><b>'+totalStock+'</b><span>Total stock</span></div>'+
      '<div class="stat '+(low?"warn":"")+'"><b>'+low+'</b><span>Low stock</span></div>'+
      '<div class="stat '+(out?"bad":"")+'"><b>'+out+'</b><span>Out of stock</span></div>'+
      '<div class="stat"><b>'+open+'</b><span>Open orders</span></div>';

    el("recentOrders").innerHTML = orders.length
      ? orders.slice(0,5).map(orderCard).join("")
      : '<p class="note">No orders yet.</p>';
    wireOrders(el("recentOrders"));
  }

  /* ---------------- inventory ---------------- */

  function renderInventory(){
    el("inventory").innerHTML = products.map(function(p){
      var s=state(p);
      return ''+
      '<div class="inv" data-id="'+esc(p.id)+'">'+
        '<div class="inv-head">'+
          '<div><h3>'+esc(p.name).toUpperCase()+'</h3>'+
            '<small>'+esc(p.pressure)+' &middot; '+esc(p.battery)+' &middot; '+esc(p.coffee_type)+'</small></div>'+
          '<span class="pill '+s.cls+'">'+s.label+'</span>'+
        '</div>'+

        '<div class="inv-row">'+
          '<span class="inv-label">Stock: '+p.stock+'</span>'+
          '<button class="btn btn-sm btn-ghost" data-act="minus">&minus;1</button>'+
          '<button class="btn btn-sm btn-ghost" data-act="plus">+1</button>'+
          '<button class="btn btn-sm btn-ghost" data-act="plus5">+5</button>'+
          '<input type="number" data-f="set" min="0" placeholder="Set" aria-label="Set stock">'+
          '<button class="btn btn-sm" data-act="set">Set</button>'+
        '</div>'+

        '<div class="inv-row">'+
          '<span class="inv-label">Price and availability</span>'+
          '<input type="number" data-f="price" min="0" step="1" value="'+Number(p.price).toFixed(0)+'" aria-label="Price">'+
          '<button class="btn btn-sm" data-act="price">Save price</button>'+
          '<button class="btn btn-sm btn-ghost" data-act="toggle">'+(p.active?"Disable":"Enable")+'</button>'+
          '<button class="btn btn-sm btn-ghost" data-act="zero">Mark sold out</button>'+
        '</div>'+
      '</div>';
    }).join("");

    el("inventory").querySelectorAll(".inv").forEach(function(box){
      var id=box.dataset.id;
      box.querySelectorAll("[data-act]").forEach(function(b){
        b.addEventListener("click", function(){
          var act=b.dataset.act;
          if(act==="minus")  return adjust(id,-1,"Manual adjustment");
          if(act==="plus")   return adjust(id, 1,"Stock received");
          if(act==="plus5")  return adjust(id, 5,"Stock received");
          if(act==="set"){
            var v=parseInt(box.querySelector('[data-f="set"]').value,10);
            if(isNaN(v)||v<0) return;
            var p=products.filter(function(x){return x.id===id;})[0];
            return adjust(id, v-p.stock, "Stock set to "+v);
          }
          if(act==="zero"){
            var p2=products.filter(function(x){return x.id===id;})[0];
            if(p2.stock===0) return;
            return adjust(id, -p2.stock, "Marked sold out");
          }
          if(act==="price"){
            var np=parseFloat(box.querySelector('[data-f="price"]').value);
            if(isNaN(np)||np<0) return;
            return update(id,{price:np});
          }
          if(act==="toggle"){
            var p3=products.filter(function(x){return x.id===id;})[0];
            return update(id,{active:!p3.active});
          }
        });
      });
    });
  }

  function adjust(id, delta, note){
    if(!delta) return;
    db.rpc("adjust_stock",{p_id:id,p_delta:delta,p_note:note}).then(function(res){
      if(res.error){ alert(res.error.message); return; }
      loadAll();
    });
  }

  function update(id, patch){
    patch.updated_at = new Date().toISOString();
    db.from("products").update(patch).eq("id",id).then(function(res){
      if(res.error){ alert(res.error.message); return; }
      loadAll();
    });
  }

  /* ---------------- orders ---------------- */

  function orderCard(o){
    var items=(o.order_items||[]).map(function(i){
      return esc(i.product_name)+" ("+esc(i.color)+") &times; "+i.qty;
    }).join("<br>");
    return ''+
    '<div class="order" data-id="'+esc(o.id)+'">'+
      '<div class="order-top">'+
        '<div><div class="order-no">#'+o.order_no+'</div>'+
        '<span class="note">'+when(o.created_at)+'</span></div>'+
        '<span class="pill '+(o.status==="COMPLETED"?"in":(o.status==="CANCELLED"?"out":"low"))+'">'+esc(o.status)+'</span>'+
      '</div>'+
      '<dl>'+
        '<dt>Name</dt><dd>'+esc(o.customer_name)+'</dd>'+
        '<dt>Phone</dt><dd><a href="tel:'+esc(o.phone)+'">'+esc(o.phone)+'</a> &middot; '+
          '<a href="https://wa.me/'+esc(String(o.phone).replace(/\D/g,""))+'" target="_blank" rel="noopener">WhatsApp</a></dd>'+
        '<dt>Area</dt><dd>'+esc(o.area)+'</dd>'+
        '<dt>Address</dt><dd>'+esc(o.address)+'</dd>'+
        (o.notes?'<dt>Notes</dt><dd>'+esc(o.notes)+'</dd>':'')+
        '<dt>Items</dt><dd>'+items+'</dd>'+
        '<dt>Total</dt><dd>'+money(o.total)+'</dd>'+
      '</dl>'+
      '<div class="status-row">'+
        STATUSES.map(function(s){
          return '<button data-status="'+s+'" aria-pressed="'+(o.status===s?"true":"false")+'">'+s+'</button>';
        }).join("")+
      '</div>'+
    '</div>';
  }

  function wireOrders(scope){
    scope.querySelectorAll(".order").forEach(function(card){
      var id=card.dataset.id;
      card.querySelectorAll("[data-status]").forEach(function(b){
        b.addEventListener("click", function(){
          db.from("orders").update({status:b.dataset.status}).eq("id",id).then(function(res){
            if(res.error){ alert(res.error.message); return; }
            loadAll();
          });
        });
      });
    });
  }

  function renderOrders(){
    el("orders").innerHTML = orders.length
      ? orders.map(orderCard).join("")
      : '<p class="note">No orders yet.</p>';
    wireOrders(el("orders"));
  }

  /* ---------------- data ---------------- */

  function renderData(){
    el("dataTable").innerHTML =
      '<thead><tr><th>Product</th><th>Model</th><th>Pressure</th><th>Type</th><th>Stock</th><th>Price</th><th>Status</th></tr></thead>'+
      '<tbody>'+products.map(function(p){
        var s=state(p);
        return '<tr><td>'+esc(p.name)+'</td><td>'+esc(p.model)+'</td><td>'+esc(p.pressure)+'</td>'+
               '<td>'+esc(p.coffee_type)+'</td><td>'+p.stock+'</td><td>'+money(p.price)+'</td>'+
               '<td><span class="pill '+s.cls+'">'+s.label+'</span></td></tr>';
      }).join("")+'</tbody>';
  }

  function renderHistory(){
    var names={}; products.forEach(function(p){ names[p.id]=p.name; });
    el("historyTable").innerHTML =
      '<thead><tr><th>When</th><th>Product</th><th>Change</th><th>Reason</th><th>Note</th></tr></thead>'+
      '<tbody>'+(logs.length?logs.map(function(l){
        return '<tr><td>'+when(l.created_at)+'</td><td>'+esc(names[l.product_id]||l.product_id)+'</td>'+
               '<td style="color:'+(l.delta>=0?"var(--green)":"var(--gold)")+'">'+(l.delta>0?"+":"")+l.delta+'</td>'+
               '<td>'+esc(l.reason)+'</td><td>'+esc(l.note||"")+'</td></tr>';
      }).join(""):'<tr><td colspan="5">No movements yet.</td></tr>')+'</tbody>';
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
